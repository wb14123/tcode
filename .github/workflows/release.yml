name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Build frontend
        working-directory: tcode-web/frontend
        run: |
          npm ci
          npm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features tcode/bundled-frontend

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          BIN_DIR="target/${TARGET}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            LIB_EXT="dylib"
          else
            LIB_EXT="so"
          fi
          LIB_NAME="libtree-sitter-tcode.${LIB_EXT}"
          for file in tcode browser-server "${LIB_NAME}"; do
            if [ ! -f "${BIN_DIR}/${file}" ]; then
              printf 'error: %s is missing from %s\n' "${file}" "${BIN_DIR}" >&2
              ls -la "${BIN_DIR}" >&2 || true
              find target -name "${LIB_NAME}" >&2 || true
              exit 1
            fi
          done
          tar -czf "tcode-${TAG}-${TARGET}.tar.gz" \
            -C "${BIN_DIR}" \
            tcode \
            browser-server \
            "${LIB_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tcode-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tcode-*.tar.gz
          generate_release_notes: true
